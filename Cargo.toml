[package]
name = "econ-sim"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20", default-features = false, features = ["2d"] }
bevy_egui = "0.43"
egui_plot = "0.37"

# Bevy is slow unoptimised; optimise dependencies fully and our code a little.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
